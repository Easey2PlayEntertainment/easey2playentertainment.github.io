        <!--setup-->
        <meta charset="utf-8">

        <meta name="author" content="North American Division of Seventh-day Adventists, Azariah Easey,  krdrabbits.com, easeystrings.com, americanfreedomtrain2026.us, bazinesdachurch.com, easey2playentertainment.com, equipandofamilias.com">

        <style>
            body {
                background-color: rgb(0, 0, 114);
                color: white;
                font-family: sans-serif;
            }

            header h1, section {
                text-align: center;
            }

            section h2 {
                display: none;
            }
        </style>

    <body>
        <header>
            <h1>Sea Cross: PBE Edition</h1>
        </header>

        <main>
            <section class="centered">
                <h2>Welcome Message</h2>
                <p>Welcome to Sea Cross: PBE Edition, where you can prepare yourself for the Pathfinder Bible Experience in retro style!</p>
                <img src="images/logo.png" alt="Sea Cross: PBE Edition logo." width="200">
            </section>
            <section>
                <h2>Form to fill out</h2>
                <label for="book">Choose the book that you are studying for, and press CREATE GAME to continue.</label>
                <form method="GET" action="game.html">
                    <select id="book" name="book">
                        <option value="0">Mark</option>
                        <option value="1">1 Peter</option>
                        <option value="2">2 Peter</option>
                        <option value="3">1 John</option>
                        <option value="4">2 John</option>
                        <option value="5">3 John</option>
                    </select>

                    <input type="submit" value="CREATE GAME">
                </form>
            </section>
        </main>

        <footer>
            
        </footer>
